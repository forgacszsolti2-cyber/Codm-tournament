      <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODM Tournament Hub</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: white;
}

header {
  text-align: center;
  padding: 40px 20px;
  background: #111;
  border-bottom: 2px solid red;
}

h1 {
  color: red;
  margin: 0;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1a1a1a;
  margin: 20px 0;
  padding: 20px;
  border-radius: 12px;
}

.title {
  color: red;
  font-size: 20px;
}

.price {
  color: #00ff99;
  font-weight: bold;
}

button {
  margin-top: 10px;
  padding: 10px;
  width: 100%;
  background: red;
  border: none;
  color: white;
  border-radius: 6px;
}

button:hover {
  background: darkred;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 5px;
  border: none;
}

#list {
  margin-top: 20px;
}

.item {
  background: #333;
  padding: 10px;
  margin-top: 10px;
  border-radius: 5px;
}

footer {
  text-align: center;
  color: gray;
  font-size: 12px;
  padding: 20px;
}
</style>
</head>

<body>

<header>
  <h1>CODM TOURNAMENT HUB</h1>
  <p>Weekly & Monthly Competitive Events</p>
</header>

<div class="container">

<!-- TOURNAMENTS -->
<div class="card">
  <div class="title">🔥 1v1 Shipment Sniper</div>
  <p>Fast sniper duels</p>
  <p class="price">Entry: 5€</p>
</div>

<div class="card">
  <div class="title">⚔ Weekly S&D</div>
  <p>Ranked style S&D</p>
  <p class="price">Entry: 5€ / player</p>
</div>

<div class="card">
  <div class="title">🏆 Monthly Scrim Bo5</div>
  <p>Championship rules</p>
  <p class="price">Entry: 5€ / player</p>
</div>

<!-- REGISTER -->
<div class="card">
  <h2>Register</h2>

  <input id="name" placeholder="Your Name">
  <input id="codid" placeholder="COD ID">

  <select id="tour">
    <option>1v1 Sniper</option>
    <option>S&D Tournament</option>
    <option>Monthly Scrim</option>
  </select>

  <button onclick="register()">Submit</button>

  <div id="list"></div>
</div>

</div>

<footer>
Discord: YOUR_DISCORD_LINK | CODM Tournament © 2026
</footer>

<script>
let regs = JSON.parse(localStorage.getItem("regs")) || [];

function render() {
  let list = document.getElementById("list");
  list.innerHTML = "";

  regs.forEach(r => {
    let div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <b>${r.name}</b><br>
      ID: ${r.codid}<br>
      Tournament: ${r.tour}
    `;
    list.appendChild(div);
  });
}

function register() {
  let name = document.getElementById("name").value;
  let codid = document.getElementById("codid").value;
  let tour = document.getElementById("tour").value;

  if(!name || !codid) {
    alert("Fill all fields!");
    return;
  }

  regs.push({name, codid, tour});
  localStorage.setItem("regs", JSON.stringify(regs));

  render();
  alert("Registered!");
}

render();
</script>

</body>
</html>
