<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODM Esports Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Orbitron, Arial;
  background:#050505;
  color:white;
}

/* TOP HEADER */
header{
  text-align:center;
  padding:60px 20px;
  background: radial-gradient(circle at top, #1a0000, #000);
  border-bottom:1px solid red;
}

h1{
  margin:0;
  font-size:42px;
  color:#ff2a2a;
  letter-spacing:3px;
  text-shadow:0 0 20px red;
}

.subtitle{
  margin-top:10px;
  color:#888;
}

/* LAYOUT */
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  gap:20px;
}

/* CARD */
.card{
  background:#0f0f0f;
  border:1px solid rgba(255,0,0,0.2);
  padding:20px;
  border-radius:15px;
  transition:0.3s;
  box-shadow:0 0 10px rgba(255,0,0,0.05);
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 0 25px rgba(255,0,0,0.3);
}

.title{
  color:#ff2a2a;
  font-size:18px;
  margin-bottom:10px;
}

.price{
  color:#00ff99;
  font-weight:bold;
}

/* FORM */
.form{
  grid-column:1/-1;
  background:#0f0f0f;
  padding:20px;
  border-radius:15px;
  border:1px solid rgba(255,0,0,0.3);
}

input,select{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#111;
  border:1px solid #222;
  color:white;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  margin-top:15px;
  background:linear-gradient(90deg,#ff0000,#800000);
  border:none;
  color:white;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  transform:scale(1.02);
}

/* LIST */
.item{
  margin-top:10px;
  padding:10px;
  background:#111;
  border-left:3px solid red;
  border-radius:8px;
}

/* PRIZE */
.pool{
  margin-top:10px;
  color:#00ff99;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  color:#555;
  font-size:12px;
}
</style>
</head>

<body>

<header>
<h1>CODM ESPORTS</h1>
<div class="subtitle">Competitive Tournament Platform</div>
</header>

<div class="container">

<div class="card">
<div class="title">🔥 1v1 Shipment Sniper</div>
<p>Fast duels on Shipment map</p>
<p class="price">Entry: 5€</p>
</div>

<div class="card">
<div class="title">⚔ Weekly S&D</div>
<p>Ranked-style competitive matches</p>
<p class="price">Entry: 5€</p>
</div>

<div class="card">
<div class="title">🏆 Monthly Scrim Bo5</div>
<p>Championship rules, serious matches</p>
<p class="price">Entry: 5€</p>
</div>

<!-- REGISTER -->
<div class="form">
<h2 style="color:red;">Register</h2>

<input id="name" placeholder="Player Name">
<input id="codid" placeholder="COD ID">

<select id="tour">
<option>1v1 Sniper</option>
<option>S&D</option>
<option>Scrim Bo5</option>
</select>

<button onclick="register()">Join Tournament</button>

<div class="pool" id="pool"></div>
<div id="list"></div>
</div>

</div>

<footer>
CODM Esports Hub © 2026
</footer>

<script>
let regs = JSON.parse(localStorage.getItem("regs")) || [];

function updatePool(){
  document.getElementById("pool").innerHTML =
  "🔥 Prize Pool: " + (regs.length * 5) + "€";
}

function render(){
  let list = document.getElementById("list");
  list.innerHTML = "";

  regs.forEach(r=>{
    let div=document.createElement("div");
    div.className="item";
    div.innerHTML=`
      <b>${r.name}</b><br>
      ${r.codid}<br>
      ${r.tour}
    `;
    list.appendChild(div);
  });

  updatePool();
}

function register(){
  let name=document.getElementById("name").value;
  let codid=document.getElementById("codid").value;
  let tour=document.getElementById("tour").value;

  if(!name||!codid){
    alert("Fill all fields");
    return;
  }

  regs.push({name,codid,tour});
  localStorage.setItem("regs",JSON.stringify(regs));

  render();
}

render();
</script>

</body>
</html>
